<style>
:root{--ink:#172554;--blue:#2563eb;--purple:#7c3aed;--green:#15803d;--red:#dc2626;--gold:#fef3c7;--bg:#f4f7ff}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(135deg,#eef2ff,#fff7ed);font-family:Arial,Helvetica,sans-serif;color:var(--ink)}
.wrap{max-width:1100px;margin:auto;padding:18px}

.tabs{display:flex;gap:10px;margin:18px 0;flex-wrap:wrap}

.topline{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap}

.pill{background:#eff6ff;color:#1d4ed8;padding:7px 12px;border-radius:99px;font-weight:700;font-size:14px}
h2{margin:8px 0 12px;font-size:clamp(20px,3vw,27px)}
.question{font-size:clamp(20px,3vw,26px);font-weight:800;margin:14px 0 18px}
.options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.option{border:3px solid #e5e7eb;background:#fff;border-radius:18px;padding:10px;cursor:pointer;text-align:center;min-width:0;transition:.15s}
.option:hover{border-color:#60a5fa;transform:translateY(-2px)}.option:disabled{cursor:default;transform:none;opacity:1}
.option img{width:100%;height:160px;object-fit:contain;background:#f8fafc;border-radius:12px}
.meaning{display:block;background:#fef3c7;border-radius:10px;padding:8px 5px;margin-top:8px;color:#713f12;font-weight:700;min-height:42px}
.feedback{margin-top:16px;padding:14px;border-radius:14px;font-weight:700;display:none}
.feedback.good{display:block;background:#dcfce7;color:#166534}.feedback.bad{display:block;background:#fee2e2;color:#991b1b}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
button.primary,button.secondary{border:0;border-radius:12px;padding:12px 20px;font-weight:800;cursor:pointer;font-size:16px}
.primary{background:#2563eb;color:#fff}.secondary{background:#e5e7eb;color:#1f2937}.primary:disabled,.secondary:disabled{opacity:.45;cursor:not-allowed}
.typecard{display:grid;grid-template-columns:minmax(0,1fr) minmax(250px,1fr);gap:20px;align-items:center}
.bigimg{width:100%;max-height:330px;object-fit:contain;border-radius:16px;background:#f8fafc;border:1px solid #e5e7eb;cursor:pointer}
.meaningbox{font-size:clamp(19px,3vw,24px);font-weight:800;background:#fef3c7;color:#713f12;padding:14px;border-radius:14px;margin:12px 0}
input{width:100%;padding:15px;border:2px solid #cbd5e1;border-radius:12px;font-size:19px;outline:none}input:focus{border-color:#2563eb}
.small{font-size:13px;color:#64748b;margin-top:8px}.hidden{display:none!important}
.result{text-align:center;padding:25px}.score{font-size:42px;font-weight:900;color:#1d4ed8}

let choiceOrder=[...words], choiceIndex=0, choiceScore=0, choiceLocked=false;
let typeOrder=[...words], typeIndex=0, typeScore=0, typeLocked=false;
function shuffle(a){let x=[...a];for(let i=x.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[x[i],x[j]]=[x[j],x[i]]}return x}
function speak(w){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(w);u.lang='en-GB';u.rate=.82;speechSynthesis.speak(u)}
function switchMode(n){document.getElementById('exercise1').classList.toggle('hidden',n!==1);document.getElementById('exercise2').classList.toggle('hidden',n!==2);document.getElementById('tab1').classList.toggle('active',n===1);document.getElementById('tab2').classList.toggle('active',n===2)}
function renderChoice(){
 if(choiceIndex>=choiceOrder.length){document.getElementById('options').innerHTML='';document.getElementById('q1').textContent='Exercise 1 complete!';document.getElementById('fb1').className='feedback good';document.getElementById('fb1').textContent=`Your score: ${choiceScore} / ${words.length}`;document.getElementById('next1').classList.add('hidden');document.getElementById('p1count').textContent='Completed';return}
 choiceLocked=false;let target=choiceOrder[choiceIndex];document.getElementById('p1count').textContent=`Question ${choiceIndex+1} / ${words.length}`;document.getElementById('p1score').textContent=`Score: ${choiceScore}`;document.getElementById('bar1').style.width=(choiceIndex/words.length*100)+'%';document.getElementById('q1').textContent=`Which picture matches: ${target.w}?`;document.getElementById('fb1').className='feedback';document.getElementById('fb1').textContent='';document.getElementById('next1').disabled=true;document.getElementById('next1').classList.remove('hidden');
 let opts=shuffle([target,...shuffle(words.filter(x=>x.n!==target.n)).slice(0,2)]);let root=document.getElementById('options');root.innerHTML='';
 opts.forEach(o=>{let b=document.createElement('button');b.className='option';b.innerHTML=`<img src="${o.img}" alt="Picture"><span class="meaning">${o.vi}</span>`;b.onclick=()=>{speak(o.w);choose(o,target,b,root)};root.appendChild(b)})
}
function choose(o,target,btn,root){if(choiceLocked)return;choiceLocked=true;let ok=o.n===target.n;if(ok)choiceScore++;[...root.children].forEach(el=>el.disabled=true);btn.style.borderColor=ok?'#16a34a':'#dc2626';let fb=document.getElementById('fb1');fb.className='feedback '+(ok?'good':'bad');fb.textContent=ok?'Correct! Well done.':`Incorrect. The correct answer is: ${target.w}.`;document.getElementById('p1score').textContent=`Score: ${choiceScore}`;document.getElementById('next1').disabled=false}
function nextChoice(){if(!choiceLocked)return;choiceIndex++;renderChoice()}
function renderTyped(){
 if(typeIndex>=typeOrder.length){document.getElementById('typeimg').classList.add('hidden');document.getElementById('meaning').textContent='Exercise completed!';document.getElementById('answer').classList.add('hidden');document.getElementById('check2').classList.add('hidden');document.getElementById('skip2').classList.add('hidden');document.getElementById('next2').classList.add('hidden');document.getElementById('fb2').className='feedback good';document.getElementById('fb2').textContent=`Your score: ${typeScore} / ${words.length}`;document.getElementById('p2count').textContent='Completed';return}
 typeLocked=false;let w=typeOrder[typeIndex];document.getElementById('p2count').textContent=`Word ${typeIndex+1} / ${words.length}`;document.getElementById('p2score').textContent=`Score: ${typeScore}`;document.getElementById('bar2').style.width=(typeIndex/words.length*100)+'%';document.getElementById('typeimg').src=w.img;document.getElementById('typeimg').classList.remove('hidden');document.getElementById('meaning').textContent=w.vi;let input=document.getElementById('answer');input.value='';input.disabled=false;input.classList.remove('hidden');document.getElementById('check2').classList.remove('hidden');document.getElementById('skip2').classList.remove('hidden');document.getElementById('check2').disabled=false;document.getElementById('skip2').disabled=false;document.getElementById('next2').classList.add('hidden');document.getElementById('fb2').className='feedback';document.getElementById('fb2').textContent='';input.focus()
}
function speakCurrent(){if(typeIndex<typeOrder.length)speak(typeOrder[typeIndex].w)}
function lockTyped(ok,skipped=false){if(typeLocked)return;typeLocked=true;let w=typeOrder[typeIndex];if(ok)typeScore++;document.getElementById('answer').disabled=true;document.getElementById('check2').disabled=true;document.getElementById('skip2').disabled=true;document.getElementById('check2').classList.add('hidden');document.getElementById('skip2').classList.add('hidden');document.getElementById('next2').classList.remove('hidden');document.getElementById('p2score').textContent=`Score: ${typeScore}`;let fb=document.getElementById('fb2');fb.className='feedback '+(ok?'good':'bad');fb.textContent=skipped?`Skipped. The correct word is: ${w.w}.`:ok?'Correct! Well done.':`Incorrect. The correct word is: ${w.w}.`}
function checkTyped(){if(typeLocked)return;let val=document.getElementById('answer').value.trim();if(!val){document.getElementById('answer').focus();return}let w=typeOrder[typeIndex];lockTyped(val.toLowerCase()===w.w.toLowerCase())}
function skipTyped(){lockTyped(false,true)}
function nextTyped(){if(!typeLocked)return;typeIndex++;renderTyped()}
document.getElementById('answer').addEventListener('keydown',e=>{if(e.key==='Enter'&&!typeLocked)checkTyped()});
renderChoice();renderTyped();
</script>
</body></html>
